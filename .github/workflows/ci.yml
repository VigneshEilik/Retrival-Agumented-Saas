name: Production RAG Chatbot SaaS CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_password
          POSTGRES_DB: rag_saas_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Run Backend Build & Typecheck
        run: cd backend && npm run build

      - name: Execute Full Jest Automated Test Suite (Unit, RAG Eval, Security Red Team, Load Test)
        env:
          DATABASE_URL: postgresql://rag_user:rag_password@localhost:5432/rag_saas_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: super-secret-jwt-key
          JWT_REFRESH_SECRET: super-secret-refresh-key
        run: cd backend && npx jest --runInBand --detectOpenHandles

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Run Frontend Production Build
        run: cd frontend && npm run build
